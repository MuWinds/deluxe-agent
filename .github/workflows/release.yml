name: Release

# Tag-driven on purpose. A `v*` tag is a deliberate act, so this runs for every
# such tag regardless of which files it points at — and GitHub does not evaluate
# `paths` filters for tag pushes anyway, so the CI allowlist cannot apply here.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Must match the toolchain in ci.yml so a released binary is built by the same
  # compiler that passed the test job.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: deluxe-agent-windows-x64.zip
            binary: deluxe-agent.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: deluxe-agent-linux-x64.tar.gz
            binary: deluxe-agent
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: deluxe-agent-macos-arm64.tar.gz
            binary: deluxe-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libxkbcommon-dev libx11-dev libxcb1-dev libwayland-dev
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\${{ matrix.target }}\release\${{ matrix.binary }} dist\
          Compress-Archive -Path dist\${{ matrix.binary }} -DestinationPath ${{ matrix.archive }} -Force
      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          tar -C dist -czf ${{ matrix.archive }} ${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
