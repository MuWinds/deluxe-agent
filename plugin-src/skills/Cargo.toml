[package]
name = "deluxe-skills"
version = "0.1.0"
edition = "2021"
publish = false

# A Component that reads a scope's skills directory through the host file
# capability, parses each `SKILL.md` itself, and renders the catalog the host
# appends verbatim. Built as a core module for `wasm32-unknown-unknown` and
# wrapped into a Component by `plugin-src/componentize`.
[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = { version = "0.46", default-features = true }
