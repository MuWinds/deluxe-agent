[package]
name = "deluxe-transcript-renderer"
version = "0.1.0"
edition = "2021"
publish = false

# A pure-computation Component: it takes request JSON and returns response JSON,
# with no host capability and no WASI. Built as a core module for
# `wasm32-unknown-unknown` and wrapped into a Component by `plugin-src/componentize`.
[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = { version = "0.46", default-features = true }
